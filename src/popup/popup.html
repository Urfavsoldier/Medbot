<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MedBot</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">
            <span class="brand-core"></span>
          </div>
          <div>
            <h1>MedBot</h1>
            <p>Voice runs in a dedicated tab</p>
          </div>
        </div>
      </header>

      <section class="hero-panel">
        <div>
          <span class="eyebrow">Current status</span>
          <p class="status-help" id="statusText">Idle</p>
        </div>
        <span class="status-dot" id="statusDot"></span>
      </section>

      <button class="button button-primary" id="openVoiceButton" type="button">
        <span class="button-shine"></span>
        Open Voice Mode
      </button>

      <p class="hint">Voice recognition stays alive after this popup closes.</p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
